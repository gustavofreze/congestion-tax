name: CI (Congestion tax)
on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'Makefile', 'rust-toolchain.toml') }}
          path: |
            .cargo-home
            target
          restore-keys: cargo-${{ github.job }}-

      - name: Install dependencies
        run: make configure

      - name: Run lint
        run: make review

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ github.job }}-${{ hashFiles('Cargo.lock', 'Makefile', 'rust-toolchain.toml') }}
          path: |
            .cargo-home
            target
          restore-keys: cargo-${{ github.job }}-

      - name: Install dependencies
        run: make configure

      - name: Run tests
        run: make tests MUTANTS_JOBS=4

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image
        run: docker build --file Dockerfile.prod --tag congestion-tax:ci .
